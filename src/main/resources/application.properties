spring.application.name=boutique
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Import variables from .env file. Checks current directory AND explicit backend directory for IDE compatibility.
spring.config.import=optional:file:.env[.properties]

# -------------------------------------------------------------------------
# COMMON CONFIGURATION (Overridden by environment variables)
# -------------------------------------------------------------------------
server.port=8080
app.base.url=${APP_BASE_URL:http://localhost:8080}

# Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SMTP Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

# Stripe Configuration
stripe.api.secretKey=${STRIPE_SECRET_KEY}
stripe.api.publishableKey=${STRIPE_PUBLISHABLE_KEY}
stripe.currency=inr

# Agora Configuration
agora.app.id=${AGORA_APP_ID}
agora.app.certificate=${AGORA_APP_CERTIFICATE}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.success-redirect-url=${FRONTEND_URL:http://localhost:3000}/oauth2/redirect
app.oauth2.failure-redirect-url=${FRONTEND_URL:http://localhost:3000}/login?error=oauth2

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}