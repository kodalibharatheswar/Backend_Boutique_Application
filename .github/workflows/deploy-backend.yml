name: Deploy Backend to EC2 via S3

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven

    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload JAR to S3 Artifact Bucket
      id: upload-s3
      run: |
        JAR_PATH=$(find target -name "*.jar" -not -name "*plain.jar" | head -n 1)
        S3_KEY="backend-builds/boutique-app-latest.jar"
        aws s3 cp $JAR_PATH s3://${{ secrets.S3_BUCKET_ARTIFACTS }}/$S3_KEY

    - name: Prepare JAR for Transfer
      run: |
        JAR_PATH=$(find target -name "*.jar" -not -name "*plain.jar" | head -n 1)
        cp $JAR_PATH target/boutique-app.jar

    - name: Copy JAR to EC2 via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/boutique-app.jar"
        target: "/home/ubuntu/app"
        strip_components: 1

    - name: Restart Backend Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Restart the systemd service
          sudo systemctl restart boutique.service
          
          # Verify status
          sudo systemctl status boutique.service --no-pager
