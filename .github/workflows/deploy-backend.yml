name: Deploy Backend to EC2 via S3

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven

    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Upload JAR to S3 Artifact Bucket
      id: upload-s3
      run: |
        JAR_PATH=$(find target -name "*.jar" -not -name "*plain.jar" | head -n 1)
        S3_KEY="backend-builds/boutique-app-latest.jar"
        aws s3 cp $JAR_PATH s3://${{ secrets.S3_BUCKET_ARTIFACTS }}/$S3_KEY

    - name: Deploy and Restart via AWS SSM
      run: |
        INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=InstanceIds,Values=$INSTANCE_ID" \ 
          --parameters 'commands=["/usr/bin/aws s3 cp s3://${{ secrets.S3_BUCKET_ARTIFACTS }}/backend-builds/boutique-app-latest.jar /home/ubuntu/app/boutique-app.jar > /home/ubuntu/app/deploy.log 2>&1","sudo chown ubuntu:ubuntu /home/ubuntu/app/boutique-app.jar >> /home/ubuntu/app/deploy.log 2>&1","sudo systemctl restart boutique.service >> /home/ubuntu/app/deploy.log 2>&1"]' \
          --comment "Deploy Backend App from S3 and Restart Service"
